# Développement sur macOS (ARM64) et Windows (AMD64).
# Les images python:3.12-slim, node:22-alpine et postgres:16-alpine
# sont publiées pour les deux architectures : ne pas forcer linux/amd64.

services:
  postgres:
    image: postgres:16-alpine
    container_name: pfa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pfa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-pfa_productivity}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pfa_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pfa-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pfa_user}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-pfa_productivity}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - pfa_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pfa-frontend
    restart: unless-stopped
    environment:
      PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pfa_network

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  pfa_network:
    name: pfa_network
    driver: bridge
